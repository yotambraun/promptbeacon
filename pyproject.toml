[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptbeacon"
version = "1.1.0"
description = "The open-source GEO engine to measure, track, and CI-test how AI (ChatGPT, Claude, Gemini) recommends your brand"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Yotam Braun" }
]
maintainers = [
    { name = "Yotam Braun" }
]
keywords = [
    "llm",
    "brand",
    "visibility",
    "monitoring",
    "ai",
    "chatgpt",
    "claude",
    "gemini",
    "brand-monitoring",
    "seo",
    "analytics",
    "geo",
    "generative-engine-optimization",
    "ai-visibility",
    "brand-tracking",
    "ai-search",
    "aeo",
    "llm-brand-monitoring",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "litellm>=1.0.0,<2.0.0",
    "httpx>=0.26.0,<1.0.0",

    "duckdb>=0.10.0,<2.0.0",
    "typer>=0.9.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.9.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "types-requests>=2.31.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
pandas = [
    "pandas>=2.0.0",
]
docs = [
    "mkdocs-material>=9.5.0",
]
grounded = [
    # Official provider SDKs for web-grounded scanning (reliable structured
    # citations). Anthropic (Brave-backed web search), OpenAI (Responses
    # web_search), Gemini (Google Search grounding); Perplexity sonar uses the
    # OpenAI-compatible client.
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "google-genai>=1.0.0",
]
all = [
    "promptbeacon[cli,pandas,grounded]",
]

[project.scripts]
promptbeacon = "promptbeacon.cli.main:app"

[project.entry-points.pytest11]
promptbeacon = "promptbeacon.pytest_plugin"

[project.urls]
Homepage = "https://github.com/yotambraun/promptbeacon"
Documentation = "https://yotambraun.github.io/promptbeacon/"
Repository = "https://github.com/yotambraun/promptbeacon"
Changelog = "https://github.com/yotambraun/promptbeacon/blob/main/CHANGELOG.md"
Issues = "https://github.com/yotambraun/promptbeacon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptbeacon"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B905",   # zip strict
]

[tool.ruff.lint.isort]
known-first-party = ["promptbeacon"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "visibility: run a PromptBeacon scan and assert AI visibility thresholds",
]

[tool.coverage.run]
source = ["src/promptbeacon"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*", "litellm.*", "duckdb.*"]
ignore_errors = true
