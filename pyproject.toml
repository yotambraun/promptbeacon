[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptbeacon"
version = "1.4.0"
description = "Does AI recommend your library or dev product? Measure it across ChatGPT, Claude, Gemini and local models, gate it in CI, and show it as a README badge."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Yotam Braun" }
]
maintainers = [
    { name = "Yotam Braun" }
]
keywords = [
    "llm",
    "brand",
    "visibility",
    "monitoring",
    "ai",
    "chatgpt",
    "claude",
    "gemini",
    "brand-monitoring",
    "seo",
    "analytics",
    "geo",
    "generative-engine-optimization",
    "ai-visibility",
    "brand-tracking",
    "ai-search",
    "aeo",
    "llm-brand-monitoring",
    "developer-tools",
    "open-source",
    "github-action",
    "mcp",
    "litellm",
    "ollama",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pytest",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    # 1.106 is the first release whose bundled price map and parameter rules
    # cover the default models (claude-haiku-5-5, gpt-6-luna). It also excludes
    # the compromised 1.82.7 / 1.82.8 releases (March 2026).
    "litellm>=1.106.0,<2.0.0",
    "httpx>=0.26.0,<1.0.0",
    "duckdb>=0.10.0,<3.0.0",
    "typer>=0.9.0,<1.0.0",
    "rich>=13.0.0,<16.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # pyproject.toml / Cargo.toml reading for `promptbeacon init` (tomllib is
    # in the standard library from Python 3.11).
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The CLI dependencies are part of the core install; the extra is kept so
# existing 'promptbeacon[cli]' installs keep working.
cli = []
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pyyaml>=6.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
pandas = [
    "pandas>=2.0.0",
]
docs = [
    "mkdocs-material>=9.5.0",
]
grounded = [
    # Official provider SDKs for web-grounded scanning (reliable structured
    # citations). Anthropic (Brave-backed web search), OpenAI (Responses
    # web_search), Gemini (Google Search grounding); Perplexity sonar uses the
    # OpenAI-compatible client.
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "google-genai>=1.0.0",
]
all = [
    "promptbeacon[cli,pandas,grounded,share,mcp]",
]
share = [
    "pillow>=10.1.0",
]
mcp = [
    "mcp>=2.3.0",
]

[project.scripts]
promptbeacon = "promptbeacon.cli.main:app"

[project.entry-points.pytest11]
promptbeacon = "promptbeacon.pytest_plugin"

[project.urls]
Homepage = "https://github.com/yotambraun/promptbeacon"
Documentation = "https://yotambraun.github.io/promptbeacon/"
Repository = "https://github.com/yotambraun/promptbeacon"
Changelog = "https://github.com/yotambraun/promptbeacon/blob/main/CHANGELOG.md"
Issues = "https://github.com/yotambraun/promptbeacon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptbeacon"]

[tool.hatch.build.targets.sdist]
# The AI Recommendation Index (index/) is a maintainer tool, not part of the
# package; its demo site is not needed to build or test PromptBeacon.
exclude = ["index/demo", "site", "assets/*.png"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "index"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B905",   # zip strict
]

[tool.ruff.lint.isort]
known-first-party = ["promptbeacon", "pbindex"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
# Warnings are errors, so deprecations surface in CI rather than in users'
# projects. Add narrow, explained ignores for third-party warnings only.
filterwarnings = ["error"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "visibility: run a PromptBeacon scan and assert AI visibility thresholds",
]

[tool.coverage.run]
source = ["src/promptbeacon"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*", "litellm.*", "duckdb.*"]
ignore_errors = true
