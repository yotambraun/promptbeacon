<svg width="760" height="200" viewBox="0 0 760 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PromptBeacon">
  <defs>
    <linearGradient id="pb" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="pbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- mark -->
  <g transform="translate(100,100)">
    <circle r="70" fill="url(#pbGlow)"/>
    <circle r="62" stroke="url(#pb)" stroke-width="8" stroke-opacity="0.28" fill="none"/>
    <circle r="43" stroke="url(#pb)" stroke-width="9" stroke-opacity="0.60" fill="none"/>
    <circle r="24" stroke="url(#pb)" stroke-width="10" stroke-opacity="0.88" fill="none"/>
    <circle r="12" fill="url(#pb)"/>
  </g>
  <!-- wordmark -->
  <text x="196" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#0f172a">Prompt<tspan fill="#6366F1">Beacon</tspan></text>
</svg>
