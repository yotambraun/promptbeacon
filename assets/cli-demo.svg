<svg width="760" height="430" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
  <rect width="760" height="430" rx="12" fill="#0d1117"/>
  <rect width="760" height="34" rx="12" fill="#161b22"/>
  <rect y="22" width="760" height="12" fill="#161b22"/>
  <circle cx="22" cy="17" r="5" fill="#ef4444"/>
  <circle cx="40" cy="17" r="5" fill="#eab308"/>
  <circle cx="58" cy="17" r="5" fill="#22c55e"/>
  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">promptbeacon — zsh</text>

  <g transform="translate(20,60)">
    <text fill="#c9d1d9"><tspan fill="#7ee787">$</tspan> pip install promptbeacon</text>
    <text y="24" fill="#8b949e">Successfully installed promptbeacon-1.0.0</text>
    <text y="56" fill="#c9d1d9"><tspan fill="#7ee787">$</tspan> promptbeacon demo "Nike"</text>
    <text y="80" fill="#58a6ff">Running in DEMO mode — canned data, no API calls.</text>

    <!-- score panel -->
    <rect y="94" width="700" height="44" rx="6" fill="none" stroke="#30363d"/>
    <text x="16" y="122" fill="#c9d1d9">Visibility Score: Nike   <tspan fill="#3fb950" font-weight="bold" font-size="18">82.8</tspan> <tspan fill="#8b949e">/ 100</tspan></text>

    <text y="166" fill="#c9d1d9"><tspan fill="#8b949e">Share of Voice:</tspan> <tspan fill="#58a6ff">47%</tspan>  (rank 2, 90% of prompts)</text>

    <!-- SoV table -->
    <g transform="translate(0,182)" fill="#c9d1d9">
      <text y="14" fill="#8b949e">┏━━━━━━━━┳━━━━━━━━━━━━┳━━━━━━━━━━┳━━━━━━━━━━━━━━━━┓</text>
      <text y="32" fill="#8b949e">┃ <tspan fill="#79c0ff">Brand</tspan>  ┃ <tspan fill="#79c0ff">Appears In</tspan> ┃ <tspan fill="#79c0ff">Presence</tspan> ┃ <tspan fill="#79c0ff">Share of Voice</tspan> ┃</text>
      <text y="50" fill="#8b949e">┡━━━━━━━━╇━━━━━━━━━━━━╇━━━━━━━━━━╇━━━━━━━━━━━━━━━━┩</text>
      <text y="68">│ Adidas │ 10/10      │ 100%     │ 53%            │</text>
      <text y="86">│ <tspan fill="#3fb950">Nike</tspan>   │ 9/10       │ 90%      │ 47%            │</text>
      <text y="104" fill="#8b949e">└────────┴────────────┴──────────┴────────────────┘</text>
    </g>

    <text y="306" fill="#8b949e"><tspan fill="#7ee787">$</tspan> <tspan fill="#c9d1d9"># add an API key, drop --demo, and it's a real scan</tspan></text>
  </g>
</svg>
