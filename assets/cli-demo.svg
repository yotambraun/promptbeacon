    <text y="134"><tspan fill="#d29922">measurement: demo</tspan><tspan fill="#8b949e"> — canned responses, not a real measurement</tspan></text>
    <text y="156"><tspan fill="#8b949e">prompts: 10 · category: running shoes</tspan></text>
    <text y="186"><tspan fill="#8b949e">Share of Voice: </tspan><tspan fill="#58a6ff">32%</tspan><tspan fill="#c9d1d9">  (rank 1, 90% of prompts)</tspan></text>
