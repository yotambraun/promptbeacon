    <text y="342"><tspan fill="#7ee787">$ </tspan><tspan fill="#c9d1d9">promptbeacon card "Nike" -t "running shoes" -c Adidas --demo --png card.png</tspan></text>
    <text y="366"><tspan fill="#7ee787">$ </tspan><tspan fill="#8b949e"># add an API key and drop --demo for a real scan</tspan></text>
