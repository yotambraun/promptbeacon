<svg width="900" height="466" viewBox="0 0 900 466" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" role="img" aria-label="promptbeacon demo output: Nike visibility 75.5/100, share of voice 32% for running shoes">
