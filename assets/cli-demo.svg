  <g transform="translate(20,62)" fill="#c9d1d9" xml:space="preserve" style="white-space:pre">
        <text y="0"><tspan fill="#7ee787">$ </tspan><tspan fill="#c9d1d9">pip install promptbeacon</tspan></text>
    <text y="24"><tspan fill="#7ee787">$ </tspan><tspan fill="#c9d1d9">promptbeacon demo "Nike" --category "running shoes" -c Adidas -c "New Balance" -c Hoka</tspan></text>
    <text y="50"><tspan fill="#58a6ff">Running in DEMO mode — canned data, no API calls.</tspan></text>
