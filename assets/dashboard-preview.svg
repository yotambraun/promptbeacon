<svg width="860" height="560" viewBox="0 0 860 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="dotg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- window -->
  <rect x="0" y="0" width="860" height="560" rx="14" fill="#0b1020"/>
  <rect x="10" y="10" width="840" height="540" rx="10" fill="#f8fafc"/>
  <!-- title bar -->
  <circle cx="34" cy="34" r="5" fill="#ef4444"/>
  <circle cx="52" cy="34" r="5" fill="#eab308"/>
  <circle cx="70" cy="34" r="5" fill="#22c55e"/>
  <text x="430" y="38" text-anchor="middle" font-size="12" fill="#94a3b8">promptbeacon-report.html</text>

  <!-- header card -->
  <g transform="translate(30,60)">
    <rect width="800" height="92" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="34" cy="34" r="15" fill="url(#dotg)"/>
    <text x="60" y="32" font-size="18" font-weight="700" fill="#0f172a">PromptBeacon — Nike</text>
    <text x="60" y="52" font-size="12" fill="#6b7280">AI visibility report · 2026-06-14</text>
    <text x="690" y="44" font-size="40" font-weight="800" fill="#22c55e">82.4</text>
    <text x="752" y="70" font-size="12" fill="#9ca3af">/ 100</text>
  </g>

  <!-- Share of Voice card -->
  <g transform="translate(30,168)">
    <rect width="800" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="22" y="32" font-size="15" font-weight="700" fill="#0f172a">Share of Voice</text>
    <text x="22" y="54" font-size="12" fill="#374151">Nike holds 38% (rank 1), appearing in 88% of prompts.</text>
    <!-- stacked bar -->
    <g transform="translate(22,68)">
      <rect width="296" height="30" rx="6" fill="#6366f1"/>
      <rect x="300" width="234" height="30" fill="#22d3ee"/>
      <rect x="538" width="218" height="30" rx="6" fill="#a855f7"/>
      <text x="148" y="20" text-anchor="middle" font-size="12" fill="#fff">Nike 38%</text>
      <text x="417" y="20" text-anchor="middle" font-size="12" fill="#fff">Adidas 30%</text>
      <text x="647" y="20" text-anchor="middle" font-size="12" fill="#fff">Puma 28%</text>
    </g>
  </g>

  <!-- breakdown + sentiment card -->
  <g transform="translate(30,304)">
    <rect width="800" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="22" y="30" font-size="15" font-weight="700" fill="#0f172a">Score Breakdown</text>
    <g transform="translate(22,44)" font-size="11" fill="#374151">
      <text y="10">Mentions 88</text>
      <rect y="16" width="430" height="8" rx="4" fill="#e5e7eb"/><rect y="16" width="378" height="8" rx="4" fill="#6366f1"/>
      <text y="42">Sentiment 76</text>
      <rect y="48" width="430" height="8" rx="4" fill="#e5e7eb"/><rect y="48" width="327" height="8" rx="4" fill="#6366f1"/>
      <text y="74">Position 71</text>
      <rect y="80" width="430" height="8" rx="4" fill="#e5e7eb"/><rect y="80" width="305" height="8" rx="4" fill="#6366f1"/>
    </g>
    <!-- sentiment donut -->
    <g transform="translate(640,60)">
      <circle r="40" fill="none" stroke="#22c55e" stroke-width="16" stroke-dasharray="176 251" transform="rotate(-90)"/>
      <circle r="40" fill="none" stroke="#94a3b8" stroke-width="16" stroke-dasharray="38 251" stroke-dashoffset="-176" transform="rotate(-90)"/>
      <circle r="40" fill="none" stroke="#ef4444" stroke-width="16" stroke-dasharray="37 251" stroke-dashoffset="-214" transform="rotate(-90)"/>
      <text y="-58" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Sentiment</text>
    </g>
  </g>

  <!-- stability card -->
  <g transform="translate(30,440)">
    <rect width="800" height="84" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="22" y="30" font-size="15" font-weight="700" fill="#0f172a">Stability <tspan font-size="11" fill="#6b7280">(5 runs)</tspan></text>
    <text x="22" y="56" font-size="32" font-weight="800" fill="#22c55e">79</text>
    <rect x="70" y="42" width="64" height="20" rx="10" fill="#22c55e"/>
    <text x="102" y="56" text-anchor="middle" font-size="11" fill="#fff">STABLE</text>
    <text x="160" y="56" font-size="12" fill="#6b7280">95% CI [61, 84] · 1 flip-flopping prompt · presence 88%</text>
  </g>
</svg>
