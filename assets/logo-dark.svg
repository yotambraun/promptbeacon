  </g>
  <text x="196" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#f8fafc">Prompt<tspan fill="#818CF8">Beacon</tspan></text>
</svg>
