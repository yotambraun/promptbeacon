# Weekly AI-visibility scan that refreshes a README badge and share card.
#
# `promptbeacon init` writes a filled-in copy of this for your project. To do it
# by hand: copy to .github/workflows/ai-visibility.yml, set your brand/category/
# competitors, and add an OPENAI_API_KEY repository secret
# (gh secret set OPENAI_API_KEY). The badge JSON is
# committed to your repo, so shields.io can render it:
#
#   [![AI visibility](https://img.shields.io/endpoint?url=https%3A%2F%2Fraw.githubusercontent.com%2FOWNER%2FREPO%2Fmain%2F.promptbeacon%2Fbadge.json)](https://github.com/yotambraun/promptbeacon)
#
# or reference the committed SVG directly: ![AI visibility](.promptbeacon/badge.svg)

name: AI visibility

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed badge and card

concurrency:
  group: ai-visibility
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Measure AI visibility
        id: beacon
        uses: yotambraun/promptbeacon@v1
        with:
          brand: "Your Product"
          category: "your category, e.g. python http client"
          competitors: |
            Competitor One
            Competitor Two
          # Pin the model so the tracked number does not move when
          # PromptBeacon's defaults change (one provider=model_id per line).
          models: |
            openai=gpt-6-luna
          max-cost: "0.05" # US dollars per run; the scan stops at the cap
          badge-path: .promptbeacon/badge.svg
          badge-endpoint-path: .promptbeacon/badge.json
          rank-badge-path: .promptbeacon/rank.svg # "#2 of 3 · ..." (2+ competitors)
          card-path: .promptbeacon/card.svg
          trend-path: .promptbeacon/trend.json # score sparkline on the card
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit badge, card and trend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .promptbeacon
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: refresh AI visibility badge (score ${{ steps.beacon.outputs.score }})"
            git push
          fi
