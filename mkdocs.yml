site_name: PromptBeacon
site_description: Does AI recommend your library or dev product? Measure it across ChatGPT, Claude, Gemini and local models, gate it in CI, and show it as a README badge.
site_url: https://yotambraun.github.io/promptbeacon/
repo_url: https://github.com/yotambraun/promptbeacon
repo_name: yotambraun/promptbeacon
edit_uri: edit/main/docs/

theme:
  name: material
  logo: https://raw.githubusercontent.com/yotambraun/promptbeacon/main/assets/logo.svg
  favicon: https://raw.githubusercontent.com/yotambraun/promptbeacon/main/assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Open-source projects: projects.md
  - Use from AI assistants: mcp.md
  - CI & examples: examples.md
  - Python API: python.md
  - Models & providers:
      - Models & local LLMs: models.md
      - Providers & cost: providers.md
  - Badges & share cards: share.md
  - AI Recommendation Index: recommendation-index.md
  - Reference:
      - CLI: cli.md
      - API reference: api-reference.md
      - Storage & history: storage.md
      - Advanced: advanced.md

# Internal planning notes stay in the repository but are not published.
exclude_docs: |
  ROADMAP-next.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
