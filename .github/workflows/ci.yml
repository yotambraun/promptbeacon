name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Every uv command below uses the matrix Python (not a local
      # .python-version file).
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Show Python version
        run: uv run python --version

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml -v

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --python 3.12

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy src index/pbindex

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Build docs (strict)
        run: uvx --with mkdocs-material mkdocs build --strict

  action-smoke:
    # Runs this repository's GitHub Action in keyless demo mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the action (demo)
        id: beacon
        uses: ./
        with:
          version: "."
          brand: "Nike"
          category: "running shoes"
          competitors: |
            Adidas
            New Balance
          demo: "true"
          badge-path: out/badge.svg
          badge-endpoint-path: out/badge.json
          card-path: out/card.svg

      - name: Check outputs
        env:
          SCORE: ${{ steps.beacon.outputs.score }}
          TIER: ${{ steps.beacon.outputs.tier }}
        run: |
          test -n "$SCORE"
          test "$TIER" = "demo"
          test -s out/badge.svg && test -s out/badge.json && test -s out/card.svg

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Check distribution
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
