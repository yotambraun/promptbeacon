name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml -v

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  action-smoke:
    # Runs this repository's GitHub Action in keyless demo mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the action (demo)
        id: beacon
        uses: ./
        with:
          version: "."
          brand: "Nike"
          category: "running shoes"
          competitors: |
            Adidas
            New Balance
          demo: "true"
          badge-path: out/badge.svg
          badge-endpoint-path: out/badge.json
          card-path: out/card.svg

      - name: Check outputs
        env:
          SCORE: ${{ steps.beacon.outputs.score }}
          TIER: ${{ steps.beacon.outputs.tier }}
        run: |
          test -n "$SCORE"
          test "$TIER" = "demo"
          test -s out/badge.svg && test -s out/badge.json && test -s out/card.svg

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: uv build

      - name: Check distribution
        run: |
          uv venv
          uv run pip install twine
          uv run twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
